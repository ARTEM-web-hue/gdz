<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5А Математика — Список</title>
    <link rel="stylesheet" href="/gdz/style.css">
</head>
<body>
    <div class="container">
        <!-- ТОП-ПАНЕЛЬ -->
        <div class="top-bar">
            <div class="logo">📐 <span>5А</span> Математика</div>
            <div class="nav-links">
                <a href="/gdz/">Главная</a>
                <a href="/gdz/Match/" class="active">ГДЗ</a>
                <button class="calc-toggle" onclick="openCalc()">🧮 Калькулятор</button>
            </div>
        </div>
        
        <!-- ШАПКА -->
        <div class="header">
            <h1>📐 5А Математика</h1>
            <div class="date">Выбери дату</div>
        </div>
        
        <!-- СПИСОК ДАТ -->
        <div class="date-list">
            <div id="dateGrid" class="date-grid">
                <div class="loading">⏳ Загрузка...</div>
            </div>
            <a href="/gdz/" class="back-link">← На главную</a>
        </div>
    </div>

    <!-- КАЛЬКУЛЯТОР -->
    <div class="calc-popup" id="calcPopup">
        <div class="calc-content">
            <button class="close-btn" onclick="closeCalc()">✕</button>
            <h2>🧮 Калькулятор</h2>
            <p style="color:#7a8a9e;margin-bottom:15px;font-size:14px;">Введите пример: <strong>12+34-5*6</strong></p>
            <input type="text" id="calcInput" placeholder="Например: 12+34-5*6" onkeydown="if(event.key==='Enter') runCalc()">
            <button class="calc-btn" onclick="runCalc()">Посчитать</button>
            <div class="calc-result" id="calcResult">Введите пример и нажмите "Посчитать"</div>
        </div>
    </div>

    <script src="/gdz/script.js"></script>
    <script>
        // ============================================================
        //  КАЛЬКУЛЯТОР
        // ============================================================
        function openCalc() {
            document.getElementById('calcPopup').classList.add('open');
            document.getElementById('calcInput').focus();
        }
        function closeCalc() {
            document.getElementById('calcPopup').classList.remove('open');
        }
        function runCalc() {
            const input = document.getElementById('calcInput');
            const expr = input.value.trim();
            if (!expr) {
                document.getElementById('calcResult').innerHTML = '❌ Введите пример';
                return;
            }
            renderCalculation(expr);
        }
        document.getElementById('calcPopup').addEventListener('click', function(e) {
            if (e.target === this) closeCalc();
        });

        // ============================================================
        //  ЗАГРУЗКА СПИСКА ДАТ
        // ============================================================
        async function loadDates() {
            const grid = document.getElementById('dateGrid');
            try {
                // Пробуем с /gdz/
                let url = '/gdz/Items/Match/';
                let response = await fetch(url);
                
                // Если не работает — пробуем без /gdz/
                if (!response.ok) {
                    url = '/Items/Match/';
                    response = await fetch(url);
                }
                
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a');
                const dates = [];
                
                for (let link of links) {
                    const href = link.getAttribute('href');
                    if (href && href.endsWith('.json')) {
                        const date = href.replace('.json', '');
                        dates.push(date);
                    }
                }
                
                if (dates.length === 0) {
                    grid.innerHTML = `
                        <div class="empty">
                            📭 Нет заданий.<br>
                            <small>Добавь JSON-файл в папку /Items/Match/</small>
                        </div>
                    `;
                    return;
                }
                
                dates.sort().reverse();
                grid.innerHTML = '';
                
                for (let date of dates) {
                    const card = document.createElement('a');
                    card.className = 'date-card';
                    // ===== ГЛАВНОЕ: ПРАВИЛЬНАЯ ССЫЛКА =====
                    card.href = `/gdz/Match/view.html?date=${date}`;
                    
                    const parts = date.split('_');
                    const day = parts[0];
                    const month = parts[1];
                    const year = parts[2];
                    
                    card.innerHTML = `
                        <div class="day">${day}</div>
                        <div class="date-full">${month}.${year}</div>
                        <div class="badge">📖 Открыть</div>
                    `;
                    grid.appendChild(card);
                }
            } catch (e) {
                console.error('Ошибка загрузки списка:', e);
                grid.innerHTML = `
                    <div class="empty">
                        ⚠️ Не удалось загрузить список.<br>
                        <small>Проверь, что есть JSON-файлы в /Items/Match/</small>
                    </div>
                `;
            }
        }
        
        loadDates();
    </script>
</body>
</html>
