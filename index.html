<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5А Класс — ГДЗ</title>
    <link rel="icon" type="image/x-icon" href="/gdz/favicon.ico">
    <link rel="stylesheet" href="/gdz/style.css">
</head>
<body>
    <div class="container main-page">
        <!-- ТОП-ПАНЕЛЬ (ЗАГРУЖАЕТСЯ ИЗ topbar.js) -->
        <div id="topbar-container"></div>
        
        <!-- ГЕРОЙ -->
        <div class="hero">
            <h1>📚 5А Класс</h1>
            <p>Готовые домашние задания по всем предметам</p>
            <div class="subjects-grid">
                <a href="/gdz/pages/?subject=Match" class="subject-card">📐 Математика</a>
                <a href="/gdz/pages/?subject=Eng" class="subject-card">🇬🇧 Английский</a>
                <a href="/gdz/pages/?subject=Russia" class="subject-card">🇷🇺 Русский</a>
                <a href="/gdz/pages/?subject=Bio" class="subject-card">🧬 Биология</a>
                <a href="/gdz/pages/?subject=Geo" class="subject-card">🌍 География</a>
                <a href="/gdz/pages/?subject=History" class="subject-card">📜 История</a>
            </div>
        </div>
        <div class="footer-info">
            <p>👤 Добавляет: <span id="mainManager">Артём</span></p>
        </div>
    </div>

    <!-- КАЛЬКУЛЯТОР -->
    <div class="calc-popup" id="calcPopup">
        <div class="calc-content">
            <button class="close-btn" onclick="closeCalc()">✕</button>
            <h2>🧮 Калькулятор</h2>
            <p style="color:#7a8a9e;margin-bottom:15px;font-size:14px;">Введите пример: <strong>12+34-5*6</strong></p>
            <input type="text" id="calcInput" placeholder="Например: 12+34-5*6" onkeydown="if(event.key==='Enter') runCalc()">
            <button class="calc-btn" onclick="runCalc()">Посчитать</button>
            <div class="calc-result" id="calcResult">Введите пример и нажмите "Посчитать"</div>
        </div>
    </div>

    <script src="/gdz/script.js"></script>
    <script src="/gdz/topbar.js"></script>
    <script>
        // Калькулятор
        function openCalc() {
            document.getElementById('calcPopup').classList.add('open');
            document.getElementById('calcInput').focus();
        }
        function closeCalc() {
            document.getElementById('calcPopup').classList.remove('open');
        }
        function runCalc() {
            const input = document.getElementById('calcInput');
            const expr = input.value.trim();
            if (!expr) {
                document.getElementById('calcResult').innerHTML = '❌ Введите пример';
                return;
            }
            renderCalculation(expr);
        }
        document.getElementById('calcPopup').addEventListener('click', function(e) {
            if (e.target === this) closeCalc();
        });
    </script>
</body>
</html>
